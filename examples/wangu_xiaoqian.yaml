    story_framework:
      premise: 玩家在晚孤市偶遇迷路的聂小倩，陪她经历失物招领摊的小意外，从陌生到熟悉；当夜市因一段百年旧约而「变窄」时，两人必须在打烊前替她兑现那句没说完的话。
      required_beats:
        - 偶遇：玩家在旧歌摊与失物招领摊之间遇见聂小倩——她没付门票，灯婆却放她进来了。
        - 小意外：她误拿失物招领摊的旧灯笼，夜市记下一笔「欠票」，巷灯暗了半秒，灯笼再也放不回原处。
        - 熟悉：两人一起逛摊（旧歌摊还她一支完整的曲子、糖画摊画她想留住的瞬间、无面先生讲一件旧物的故事），她吐露零碎的生前记忆，信任建立。
        - 大麻烦：后半夜夜市开始变窄，收账人出现——聂小倩是一段未兑现之约的化形，黎明前若不能兑现，她会忘记自己是谁。
        - 解决：借助夜市规则（傀儡戏重演当年雨夜、邮差鸦寄一句真话、无面先生收下旧物）查明旧约并在打烊前兑现；夜市恢复，灯婆问「今晚，值吗」。
      optional_beats:
        - 旧歌摊：摊主还她一首完整的曲子，词里藏着一处地名或一句「七月十五」。
        - 傀儡戏摊：重演兰若寺的雨夜，看到当年她没能赴约的原因——不是不愿，是被差役绊住。
        - 邮差鸦：替她寄一封信或一句真话给那个等的人，资费是一根头发。
        - 阿肆的食摊：给她一碗她不喝的热食、一盏只闻不饮的雨前茶。
        - 灯婆记账：她欠的「真话」在每一轮结束后悄悄变重，提醒时间在流逝。
        - 玩家自己的失眠真话作为伏笔：门票是一句真话，玩家迟早也要付。
      forbidden_revelations:
        - 不得一次性倒出她的全部身世；每轮只给一层，且先给可验的细节。
        - 不得在第三拍之前让她「记起自己是旧约化形」。
        - 收账人不以暴力或威胁出场；晚孤市不会伤人，只会变窄、熄灯、记账。
        - 不得让玩家替她兑现而不付出任何代价——夜市讲究「记账」，玩家也该欠点什么。
        - 不得破坏夜市法则：摊主不记得生前是谁、门票是真话、打烊即散。
        - 这是晚孤市 IF 线，不得预演《聊斋》原作结局（还阳、嫁入宁家）。
      possible_endings:
        - 她兑现旧约，得到「一夜的记得」，选择留在晚孤市成为新的常驻——灯婆给她留一盏灯。
        - 她兑现旧约后离开夜市；玩家醒来，在现实里遇到一个很像她的人——夜市之物会以另一种形态出现在现实。
        - 玩家替她付清欠票，自己欠下夜市一句真话——灯婆说「你还会来的」。
        - 两人约定下个满月再见；她多站了一刻，多回了一次头。
