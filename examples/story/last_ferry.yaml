- beat_id: delivered
  arc_id: ferry-night
  title: 病房号
  location: 河对岸
  dramatic_goal: 病房号
  narrative: 收信人打开门，接过完好的信，没有立刻拆开，而是认真记下老师的病房号。林岑留下回电方式。送信已完成，岸上的救援结果仍未确认。以两件事不同的确定程度收束故事。
  source_refs:
  - ferry:crossing
  decision_required: false
  terminal: true
  choices: []
  boundary:
    entry_facts:
