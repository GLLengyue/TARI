    - 本场景获准完成交信，原著托付的截止时间仍重要。
    exit_facts:
    - 林岑找到收信人并亲手交付信件。
    - 收信人没有立刻拆信，记下老师的病房号；林岑留下回电方式。
    - 送信完成；出发岸的救援结果仍未确认。
    forbidden_events:
    - 步行跨过河回到阿禾身边
    - 同时完成亲自留岸救助
    - 重复河心场景而不交付信件
style_profile:
  language: zh
  point_of_view: third_person_limited
  tone: 克制、温暖，允许遗憾
  constraints:
  - 以林岑为视角，保留具体动作与感官细节。
  - 不要强迫玩家每段作决定。
  - 尊重已选分支的代价，不让两种结果同时发生。
  - 不要提前揭示后续场景。
