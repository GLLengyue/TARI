evidence:
- ref_id: ferry:quay
  label: 码头
  location: examples/story/last_ferry.md#码头
  excerpt: '林岑答应替住院的老师把一封信送到河对岸。收信人明早就要离开这座城。

    傍晚，最后一班渡船还在码头等候，雨却已经淹过了石阶。老师没有催促，

    只说如果来不及，也请给他一个确切的回音。信的封口一直完好。'
- ref_id: ferry:rain
  label: 雨中的钟声
  location: examples/story/last_ferry.md#雨中的钟声
  excerpt: '渡船响了第一次铃。船夫周伯告诉林岑，河道快封了，今晚不会再开第二趟。

    这时旧候船室的屋顶漏水，守屋的阿禾正把几个孩子往高处带。

    她推不开储物间的铁门，里面放着木板和干毯子。她喊住林岑，请他搭把手。'
- ref_id: ferry:decision
  label: 分歧
  location: examples/story/last_ferry.md#分歧
  excerpt: '周伯能再等一分钟。留下帮忙就会错过今晚的船；登船则能在收信人离开之前

    送达信件，但阿禾必须另找帮手。这里没有保证两件事都能办成的捷径。

    林岑既记得老师的托付，也看见孩子们已经湿透的鞋子。'
- ref_id: ferry:crossing
  label: 渡河
  location: examples/story/last_ferry.md#渡河
  excerpt: '原短篇沿着送信的方向继续：林岑向阿禾说明了托付，登上渡船，请周伯用电台

    联系岸上的值班人。隔着雨，他没能听清回应。船行至河心时，城里的灯逐排熄灭。

    他把信放在衣服最里面。对岸的收信人开门后没有拆信，只认真记下老师的病房号。

    林岑留了回电方式，知道自己兑现了一件承诺，也留下了一件暂时没有答案的事。'
- ref_id: ferry:shelter
  label: 另一种可能
  location: examples/story/last_ferry.md#另一种可能
  excerpt: '改编分支允许林岑留下：他和阿禾顶开铁门，垫起木板，让孩子们坐到干燥的地方。

    铃声停了，渡船离岸。信没有送到，封口仍然完好。天亮前，林岑借到电话，

    如实告诉老师今晚发生的事，并请求对岸的联系方式。他不能把错过说成已经完成。

    雨稍小时，阿禾替他把潮湿的信封烘干。他们约定等河道重新开放，再一起想办法。'
