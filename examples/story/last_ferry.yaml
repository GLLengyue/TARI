schema_version: 1
story_id: last-ferry
title: 最后一班渡船
locale: zh
opening: '林岑答应替住院的老师把一封信送到河对岸。收信人明早就要离开这座城。

  傍晚，最后一班渡船还在码头等候，雨却已经淹过了石阶。老师没有催促，

  只说如果来不及，也请给他一个确切的回音。信的封口一直完好。'
