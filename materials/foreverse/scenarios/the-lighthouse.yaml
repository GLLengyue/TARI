  en:
    title: The Lighthouse at Grey Hollow
    opening: 'GREY HOLLOW LIGHT

      NOV 3 · 1897


      Character of the light2 fl. W · 14s dark


      WindNE, freshening


      Light-up16:41 · 19 min


      Your post2nd Asst. Keeper


      The Foxglove does not stay for coffee. Her boat sets you on the landing with
      your chest and the winter stores, and by the time the derrick swings the last
      crate up she is already standing off, rolling in the swell, her whistle giving
      one short blast that might be farewell and might be relief.


      Grey Hollow is three acres of granite with a white tower growing out of it.
      Everything is wet: the rock, the rail, the air. The derrick''s counterweight
      is an old cannonball somebody once painted yellow, for no reason anyone aboard
      could tell you. From the landing, iron stairs climb to the house. You will learn
      to count a different set soon enough.


      Elias Pruitt meets you halfway down, bareheaded in the spray, a man built like
      the tower''s little brother. He shakes your hand once, dry-palmed in all this
      weather, and consults a manifest.


      "One chest. Flour, oil, wicks, the mail." A pencil tick per item. "Good. You''ll
      want the fire. Supper is six. Mrs. Adler doesn''t ring twice."


      From high above, a voice drops down between the gusts. A man leans at the gallery
      rail under the lantern, waving his cap: sandy beard, sea coat, pocketknife in
      the waving hand.


      "New hand!" he calls. "Mind the forty-first stair, she''s proud of herself!"
      And he''s gone inside the lamp room, where a shadow crosses the glass twice,
      then stops crossing.


      The entry hall smells of oil, brine, and bread. A row of coat hooks. Pruitt
      hangs his sou''wester on the first. Your hook is the fourth. On the third hangs
      an oilskin coat, and here is the thing your eye snags on and cannot say why
      aloud: everything in this house is damp, and the coat is dry as a hymnal. Sea
      boots stand beneath it, toes to the door.


      "Mr. Quill''s," Pruitt says, in the exact voice he used for the flour. "Transferred
      to the mainland, October. His effects follow when the Board sends for them."
      He is already walking. "That hook stays as it is."


      In the kitchen doorway a woman''s voice, warm as the stove behind it: "Supper''s
      at six, and it''s chowder, and there''s bread if the new one''s civil." The
      table beyond her is laid for four. The fourth plate is turned face-down. The
      dog, a grey water-dog with a white muzzle, lies across the kitchen threshold
      and watches, of all things, the hallway ceiling.


      Pruitt sets the station log on its stand and opens it to today. Ruled columns,
      twenty-two years of weather in one patient hand. He enters the date, the wind,
      the tender''s call, and then turns the book to face you and holds out the pen.


      "New keeper signs on arrival. Full signature, the Board likes a full name."
      His thumb, perhaps by accident, covers the line above yours. Through the window
      behind him the daylight is going out of the sky like water out of a basin. "Then
      we climb. You''ll take the first watch with me. The stairs are sixty-three."


      He says that last the way other men say amen. The pen is in your hand. Nineteen
      minutes to light-up.


      📜 Standing Orders · posted by the door (excerpt)


      1. The light burns sunset to sunrise. Never early. Never late.


      2. Wind the clockwork before the bell finishes striking the hour.


      3. The stairs are sixty-three. Count them. A different number means go down
      and begin again.


      4. Every watch is logged. Nothing in the log is ever struck out.


      5. Meals at the bell. Supper is six.


      6. The third hook in the entry hall stays as it is.


      7. (the seventh line is pasted over with a fresh strip of paper)


      🧳 Effects of N. Quill, 2nd Asst. · awaiting shipment


      One razor, dry. One Bible, flyleaf inscribed "to Nate, from Mother, mind the
      sea."


      One tobacco tin, half full. One pocket comb.


      One letter, sealed, addressed to the station itself: "GREY HOLLOW LIGHT." No
      stamp.


      Logged by E. Pruitt, Oct 12. The oilskin coat and boots are not on the list.'
