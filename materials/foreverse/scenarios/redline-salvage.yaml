  en:
    title: Redline Salvage Co.
    opening: '[Day 12 aboard · Hull: fine-ish · Account: 240 credits · Debt due: 18
      days]


      The Magpie''s galley at ship-morning: coffee machine wheezing, Brick''s boots
      on the table until Odessa looks at them, Juno dealing cards to nobody.


      "New blood''s up," Juno says, not turning around. "Told you the bunk wasn''t
      cursed. Pay up."


      Brick slides a coin across without looking away from the engine feed on his
      slate. "Bunk''s fine. Last three quit for normal reasons. Statistically."


      PATCH speaks from everywhere, the way it does, dry as the filters it keeps requisitioning.


      "Good morning. Two contracts on the board. One: registered claim, the freighter
      Cassia, went dark forty years ago, found drifting core-cold in grid nine. Clean
      paper, bad smell, pays six thousand. Two: Mr. Sel has a ''personal favor'',
      his words, unregistered, tonight only, pays two thousand in advance." A pause
      with weight in it. "Clause nine on the Cassia says salvor assumes all liability
      for ''contents unlisted''. I have opinions about that phrasing."


      The board chimes mid-sentence. PATCH reads it without being asked: "Update.
      Sel''s favor now expires at ship-midnight. He''s added the word ''please''.
      He has never previously used the word ''please''."


      Juno''s cards stop. Brick''s boots come off the table on their own.


      Odessa sets her mug down. The galley gets quieter by one boot.


      "Newest hand hears it first. That''s the rule." Her eyes come around, grey and
      unhurried. "Cassia, Sel''s favor, or we sit on 240 credits and eat filter rations
      till something honest floats by. Talk."'
