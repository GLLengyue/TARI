[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-trpg-runtime"
version = "0.1.0"
description = "A typed, auditable PbtA-inspired agentic TRPG runtime built with PydanticAI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Agentic TRPG Runtime contributors"}]
keywords = ["trpg", "agents", "pydantic-ai", "roleplay", "pbta"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-ai-slim>=1.0",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
trpg = "trpg_runtime.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/trpg_runtime"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
